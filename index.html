<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farewell Video</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline controls>
    <source src="https://res.cloudinary.com/emicicgu/video/upload/v1790321113/video.mp4" type="video/mp4">
    Your browser does not support video playback.
  </video>

  <script>
    const video = document.getElementById("video");

    // Browsers generally allow autoplay only when muted.
    video.play().catch(() => {});

    // Try fullscreen after the first user interaction.
    document.addEventListener("click", () => {
      if (!document.fullscreenElement && video.requestFullscreen) {
        video.requestFullscreen().catch(() => {});
      }
    }, { once: true });
  </script>
</body>
</html>
