<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farewell - Shyam</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
    </style>
</head>

<body>

<video id="video" autoplay muted playsinline controls>
    <source
        src="https://aveekroy52004-ux.github.io/shyam/"
        type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

document.addEventListener("click", () => {
    video.muted = false;
    video.play();

    if (video.requestFullscreen) {
        video.requestFullscreen();
    }
}, { once: true });
</script>

</body>
</html>
